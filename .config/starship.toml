"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$fill\
${custom.node}\
${custom.pnpm}\
$cmd_duration\
$jobs\
$time\
$line_break\
$character"""

[fill]
symbol = " "

[directory]
style = "blue"
read_only = " "
truncation_length = 6
truncate_to_repo = true

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
ignore_bare_repo = true

[jobs]
symbol = ""
style = "bold red"
number_threshold = 1
format = "[$symbol]($style)"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "cyan"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[git_metrics]
disabled = false

[cmd_duration]
format = "[$duration]($style)"
style = "yellow"

[memory_usage]
symbol = " "

[rust]
symbol = " "

[time]
disabled = false
style = "bold white"
format = "[$time]($style)"

[custom.npm]
description = "Version for npm in the working directory"
command = "npm --version"
symbol = "🐸 v"
style = "bold green"
ignore_timeout = true
format = "[$symbol($output )]($style)"

[custom.node]
description = "Node.js version pnpm is set to use, falling back to fnm's current version"
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]
detect_extensions = ["js", "mjs", "cjs", "ts"]
shell = ["bash", "--noprofile", "--norc"]
command = '''
version=$(COREPACK_ENABLE_DOWNLOAD_PROMPT=0 COREPACK_ENABLE_NETWORK_DOWNLOADS=0 pnpm node -v 2>/dev/null)
[ -z "$version" ] && version=$(fnm current 2>/dev/null)
[ -n "$version" ] && echo "$version"
'''
ignore_timeout = true
symbol = " "
style = "bold green"
format = "[$symbol($output )]($style)"

[custom.pnpm]
command = "pnpm -v"
ignore_timeout = true
format = '[$symbol(v$output )]($style)'
description = "The currently installed version of PNPM"
style = "bold yellow"
detect_files = ['pnpm-lock.yaml']
symbol = 'pnpm '
